name: Run tests

on:
  push:
    branches:
      - master
    tags: '*'
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test-github:
    name: CCOpt - ${{ matrix.julia-version }}
    runs-on: ${{ matrix.os }}
    permissions:
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
          os: [ubuntu-22.04]
          julia-version: ['1']
          julia-arch: [x64]
    env:

    steps:
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            moi:
              - 'ext/CCOptMathOptInterface/**'
              - 'test/MOI_wrapper.jl'
      - name: add mot tests # run moi tests on master and if the wrapper is changed.
        if: |
          steps.changes.outputs.moi == 'true' ||
          github.event_name == 'push'
        run: |
          echo "TEST_ARGS='$TEST_ARGS MOI'" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@latest
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-runtest@latest
        with:
          test-args: ${{ env.test_args }}